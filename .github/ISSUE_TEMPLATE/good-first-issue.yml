name: Good first issue (maintainers)
description: A well-scoped task for a new contributor
labels: ["good first issue"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: One clear outcome.
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      label: Where to look
      description: Files, docs, and related code.
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      placeholder: "- [ ] Behavior\n- [ ] Tests\n- [ ] Docs if needed"
    validations: { required: true }
  - type: input
    id: time
    attributes:
      label: Estimated effort
      placeholder: "2-4 hours"
