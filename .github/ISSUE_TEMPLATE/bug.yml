name: Bug report
description: Something is broken
labels: ["type:bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [contracts, web, indexer, sdk, schemas, tokens, docs]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node version, Rust version, network (local or testnet), commit hash
