name: Feature request
description: Propose a feature or improvement
labels: ["type:feature"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [contracts, web, indexer, sdk, schemas, tokens, docs]
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what can't they do today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
